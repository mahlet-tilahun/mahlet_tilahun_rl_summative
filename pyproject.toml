[project]
name = "mahlet-tilahun-rl-summative"
version = "0.1.0"
description = "Mission-based RL: an Ethiopian Health Extension Worker agent trained with TorchRL (DQN, REINFORCE, PPO, A2C)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "torchrl>=0.15",
    "tensordict>=0.15",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false
